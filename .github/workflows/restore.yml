name: Restore public site

on:
  push:
    branches: [main]
    paths:
      - '.restore2/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for complete restore archive
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .restore2/part-07 ]; then
            echo 'Restore archive not complete yet.'
            exit 0
          fi
          cat .restore2/part-* | base64 --decode > /tmp/quelle-auf.tar.xz
          xz -t /tmp/quelle-auf.tar.xz

      - name: Restore publication tree
        if: ${{ hashFiles('.restore2/part-07') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xJf /tmp/quelle-auf.tar.xz -C .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore public Quelle auf site from clean archive'
          git push origin HEAD:main
